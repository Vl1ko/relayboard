# Explicit opt-in for owned MAX/WhatsApp + AI workers. Do not combine with synthetic overlay.
x-live-environment: &live-environment
  NODE_ENV: production
  DATABASE_URL: postgres://relayboard:relayboard@postgres:5432/relayboard
  REDIS_URL: redis://redis:6379
  CONTACT_IMPORT_ENABLED: "true"
  MAX_WORKER_ENABLED: "true"
  MAX_WORKER_HOST: 0.0.0.0
  MAX_WORKER_PORT: "3030"
  MAX_WORKER_URL: http://max-worker:3030
  MAX_WORKER_SECRET: ${MAX_WORKER_SECRET:?Set a private MAX_WORKER_SECRET}
  WHATSAPP_BRIDGE_URL: http://whatsapp:3010
  TELEGRAM_BRIDGE_URL: http://telegram:3020
  AI_SEND_MODE: live
  AI_PROVIDER_MODE: gigachat
  AI_ALLOW_EXTERNAL_REQUESTS: "true"
  GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:?Configure GigaChat through the private environment}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
  AI_TEST_ONLY: ${AI_TEST_ONLY:-true}
  AI_TEST_ACCOUNT_IDS: ${AI_TEST_ACCOUNT_IDS:-}
  AI_TEST_AUTHOR_IDS: ${AI_TEST_AUTHOR_IDS:-}
  SOURCE_MONITOR_ENABLED: ${SOURCE_MONITOR_ENABLED:-false}
x-live-logging: &live-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  api:
    environment: *live-environment
    command: [sh, -c, "node dist-node/api/migrate.js && node dist-node/api/migrate-ai-manager.js && node dist-node/api/server.js"]
  worker:
    environment: *live-environment
    depends_on:
      max-worker:
        condition: service_healthy
      whatsapp:
        condition: service_started
  whatsapp:
    environment:
      <<: *live-environment
      WHATSAPP_SESSION_PATH: /app/data/whatsapp-session
      WHATSAPP_CHROMIUM_PATH: /usr/bin/chromium
  telegram:
    environment:
      <<: *live-environment
      TELEGRAM_SESSION_PATH: /app/data/telegram/session.json
  max-worker:
    image: relayboard:local
    pull_policy: never
    env_file: .env
    environment: *live-environment
    command: [node, dist-node/messenger-worker/index.js]
    logging: *live-logging
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3030/health',{headers:{authorization:'Bearer '+process.env.MAX_WORKER_SECRET}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  ai-worker:
    image: relayboard:local
    pull_policy: never
    env_file: .env
    environment:
      <<: *live-environment
      NODE_EXTRA_CA_CERTS: /app/certs/gigachat-root-ca.pem
    command: [node, dist-node/ai-worker/index.js]
    logging: *live-logging
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
      max-worker:
        condition: service_healthy
      whatsapp:
        condition: service_started
    restart: unless-stopped
