services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayboard
      POSTGRES_USER: relayboard
      POSTGRES_PASSWORD: relayboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayboard"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    image: relayboard:local
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://relayboard:relayboard@postgres:5432/relayboard
      REDIS_URL: redis://redis:6379
      WHATSAPP_BRIDGE_URL: http://whatsapp:3010
      TELEGRAM_BRIDGE_URL: http://telegram:3020
    command: ["sh", "-c", "node dist-node/api/migrate.js && node dist-node/api/server.js"]
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: relayboard:local
    pull_policy: never
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://relayboard:relayboard@postgres:5432/relayboard
      REDIS_URL: redis://redis:6379
      WHATSAPP_BRIDGE_URL: http://whatsapp:3010
      TELEGRAM_BRIDGE_URL: http://telegram:3020
    command: ["node", "dist-node/worker/index.js"]
    depends_on:
      api:
        condition: service_started
      telegram:
        condition: service_started

  whatsapp:
    image: relayboard:local
    pull_policy: never
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://relayboard:relayboard@postgres:5432/relayboard
      REDIS_URL: redis://redis:6379
      WHATSAPP_SESSION_PATH: /app/data/whatsapp-session
      WHATSAPP_CHROMIUM_PATH: /usr/bin/chromium
    command: ["node", "dist-node/whatsapp-bridge/index.js"]
    volumes:
      - whatsapp_session:/app/data/whatsapp-session
    shm_size: 1gb
    depends_on:
      - api

  telegram:
    image: relayboard:local
    pull_policy: never
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://relayboard:relayboard@postgres:5432/relayboard
      REDIS_URL: redis://redis:6379
      TELEGRAM_SESSION_PATH: /app/data/telegram/session.json
    command: ["node", "dist-node/telegram-bridge/index.js"]
    volumes:
      - telegram_session:/app/data/telegram
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  whatsapp_session:
  telegram_session:
